name: Island
description: 'Island is the developer of the Enterprise Browser, a Chromium-based browser
  purpose-built for the enterprise that embeds security, data protection, and governance
  directly into the last mile of work. The platform unifies an Enterprise Browser,
  Enterprise AI, and an Enterprise Network (SASE) so organizations can control how
  users interact with SaaS and internal applications, enforcing data-loss prevention,
  privileged access, insider-risk controls, and zero-trust policy at the browser layer,
  and replacing VDI/DaaS for many contractor and BYOD scenarios. Island is a private
  cybersecurity company backed by Insight Partners and other investors. No public developer
  API or OpenAPI surface is published; administration is via the management console
  at management.island.io.'
